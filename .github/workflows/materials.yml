name: Contract documents and test harness
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    working-directory: services/materials
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: olympiad_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: olympiad_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U olympiad_test -d olympiad_tests"
          --health-interval 5s --health-timeout 5s --health-retries 12
      s3:
        image: versity/versitygw:v1.11.0
        env:
          ROOT_ACCESS_KEY_ID: olympiad-test
          ROOT_SECRET_ACCESS_KEY: local-test-storage-only
          VGW_BACKEND: posix
          VGW_BACKEND_ARGS: /data
          VGW_FSYNC: 'true'
        ports: ['17070:7070']
        volumes: ['/data']
    env:
      TEST_S3_ENDPOINT: http://127.0.0.1:17070
      TEST_S3_ACCESS_KEY: olympiad-test
      TEST_S3_SECRET_KEY: local-test-storage-only
      TEST_POSTGRES_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=olympiad_tests;Username=olympiad_test;Password=local-ci-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/materials/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core poppler-utils
      - run: npm ci
      - run: npm test
      - run: node --check tests/acceptance.test.mjs
      - run: node validation/audit-architecture.mjs .
      - run: npm exec --yes --package=@redocly/cli@2.62.1 -- redocly lint contracts/openapi.json --extends minimal
      - run: npm run test:service
        env:
          PDF_ARTIFACT_DIR: artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materials-rendered-pdf-proof
          path: services/materials/artifacts

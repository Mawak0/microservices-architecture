name: Service review chains
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.services.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: services
        shell: bash
        run: |
          node --input-type=module -e "import{existsSync}from'node:fs';import{appendFileSync}from'node:fs';const service=['materials','intake','review'].filter(x=>existsSync('services/'+x+'/.review-stage.json'));appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify({service:service.length?service:['layout']})+'\n')"
  test:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: olympiad_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: olympiad_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U olympiad_test -d olympiad_tests"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_POSTGRES_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=olympiad_tests;Username=olympiad_test;Password=local-ci-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - if: matrix.service == 'materials'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core poppler-utils
      - if: matrix.service != 'layout'
        run: npm ci --prefix services/${{ matrix.service }}
      - if: matrix.service != 'layout'
        run: node tools/review-ci.mjs ${{ matrix.service }}
      - if: matrix.service == 'layout'
        run: node --check tools/review-ci.mjs

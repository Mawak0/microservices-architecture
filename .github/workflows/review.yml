name: Contract documents and test harness
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    working-directory: services/review
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: olympiad_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: olympiad_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U olympiad_test -d olympiad_tests"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_POSTGRES_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=olympiad_tests;Username=olympiad_test;Password=local-ci-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/review/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm test
      - run: node --check tests/acceptance.test.mjs
      - run: node validation/audit-architecture.mjs .
      - run: npm exec --yes --package=@redocly/cli@2.62.1 -- redocly lint contracts/openapi.json --extends minimal
      - run: dotnet test Olympiad.Review.sln --configuration Release
      - run: npm run test:service

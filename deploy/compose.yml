services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_DB: platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      SERVICE_DATABASE_PASSWORD: ${SERVICE_DATABASE_PASSWORD:?Set SERVICE_DATABASE_PASSWORD}
    ports: ['127.0.0.1:55432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initialize.sh:/docker-entrypoint-initdb.d/10-services.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform_admin -d platform_admin']
      interval: 5s
      timeout: 5s
      retries: 12
  s3:
    image: versity/versitygw:v1.11.0
    environment:
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data
      VGW_FSYNC: 'true'
    ports: ['127.0.0.1:17070:7070']
    volumes:
      - s3-data:/data
volumes:
  s3-data:
  postgres-data:

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_DB: platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      MATERIALS_DATABASE_PASSWORD: ${MATERIALS_DATABASE_PASSWORD:?Set MATERIALS_DATABASE_PASSWORD}
      INTAKE_DATABASE_PASSWORD: ${INTAKE_DATABASE_PASSWORD:?Set INTAKE_DATABASE_PASSWORD}
      REVIEW_DATABASE_PASSWORD: ${REVIEW_DATABASE_PASSWORD:?Set REVIEW_DATABASE_PASSWORD}
      DEMO_DATABASE_PASSWORD: ${DEMO_DATABASE_PASSWORD:?Set DEMO_DATABASE_PASSWORD}
    ports: ['127.0.0.1:55432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initialize.sh:/docker-entrypoint-initdb.d/10-services.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform_admin -d platform_admin']
      interval: 5s
      timeout: 5s
      retries: 12
  s3:
    image: versity/versitygw:v1.11.0
    environment:
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data
      VGW_FSYNC: 'true'
    ports: ['127.0.0.1:17070:7070']
    volumes:
      - s3-data:/data

  demo:
    build: { context: .., dockerfile: deploy/Demo.Dockerfile }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    ports: ['127.0.0.1:19180:19180']
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: demo
      PGUSER: demo
      PGPASSWORD: ${DEMO_DATABASE_PASSWORD:?Set DEMO_DATABASE_PASSWORD}
      DEMO_INTERNAL_BASE_URL: http://demo:19180
      DEMO_MATERIALS_URL: http://materials:8080
      DEMO_INTAKE_URL: http://intake:8080
      DEMO_REVIEW_URL: http://review:8080
  materials:
    build:
      context: ..
      dockerfile: deploy/Service.Dockerfile
      args: { SERVICE: materials, SERVICE_TITLE: Materials }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_started }
      demo: { condition: service_started }
    ports: ['127.0.0.1:19181:8080']
    environment:
      Storage__ConnectionString: 'Host=postgres;Database=materials;Username=materials;Password=${MATERIALS_DATABASE_PASSWORD:?Set MATERIALS_DATABASE_PASSWORD}'
      Dependencies__BaseUrl: http://demo:19180
      Dependencies__TemplatesBaseUrl: http://demo:19180
      Dependencies__MaterialsBaseUrl: http://materials:8080
      Dependencies__ReviewBaseUrl: http://review:8080
      Dependencies__ReceiptsBaseUrl: http://intake:8080
      Dependencies__AccessToken: demo-system
      S3__Endpoint: http://s3:7070
      S3__Region: us-east-1
      S3__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
  intake:
    build:
      context: ..
      dockerfile: deploy/Service.Dockerfile
      args: { SERVICE: intake, SERVICE_TITLE: Intake }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_started }
      demo: { condition: service_started }
    ports: ['127.0.0.1:19182:8080']
    environment:
      Storage__ConnectionString: 'Host=postgres;Database=intake;Username=intake;Password=${INTAKE_DATABASE_PASSWORD:?Set INTAKE_DATABASE_PASSWORD}'
      Dependencies__BaseUrl: http://demo:19180
      Dependencies__TemplatesBaseUrl: http://demo:19180
      Dependencies__MaterialsBaseUrl: http://materials:8080
      Dependencies__ReviewBaseUrl: http://review:8080
      Dependencies__ReceiptsBaseUrl: http://intake:8080
      Dependencies__AccessToken: demo-system
      S3__Endpoint: http://s3:7070
      S3__Region: us-east-1
      S3__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
  review:
    build:
      context: ..
      dockerfile: deploy/Service.Dockerfile
      args: { SERVICE: review, SERVICE_TITLE: Review }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_started }
      demo: { condition: service_started }
    ports: ['127.0.0.1:19183:8080']
    environment:
      Storage__ConnectionString: 'Host=postgres;Database=review;Username=review;Password=${REVIEW_DATABASE_PASSWORD:?Set REVIEW_DATABASE_PASSWORD}'
      Dependencies__BaseUrl: http://demo:19180
      Dependencies__TemplatesBaseUrl: http://demo:19180
      Dependencies__MaterialsBaseUrl: http://materials:8080
      Dependencies__ReviewBaseUrl: http://review:8080
      Dependencies__ReceiptsBaseUrl: http://intake:8080
      Dependencies__AccessToken: demo-system

volumes:
  s3-data:
  postgres-data:
